version: 2

updates:
  # Dependências da aplicação: Next.js, React, Supabase, Zod, ESLint,
  # Vitest etc. (todas declaradas em package.json). Agrupadas para reduzir
  # o número de PRs quando várias libs do mesmo ecossistema saem juntas.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      nextjs:
        patterns:
          - 'next'
          - 'eslint-config-next'
      supabase:
        patterns:
          - '@supabase/*'

  # Actions usadas nos workflows (checkout, setup-node, codeql-action,
  # gitleaks-action...). Manter atualizadas reduz risco de supply chain
  # no próprio CI/CD.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
