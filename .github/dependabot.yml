version: 2

updates:
  # Dependências da aplicação: Next.js, React, Supabase, Zod, ESLint,
  # Vitest etc. (todas declaradas em package.json). Agrupadas para reduzir
  # o número de PRs quando várias libs do mesmo ecossistema saem juntas.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      nextjs:
        patterns:
          - 'next'
          - 'eslint-config-next'
      supabase:
        patterns:
          - '@supabase/*'
    ignore:
      # eslint-config-next ainda quebra com a nova API interna do ESLint 10
      # ("scopeManager.addGlobals is not a function") — ver PR #4.
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']
      # typescript-eslint ainda não suporta o TypeScript 7 (reescrita em Go) —
      # ver PR #5 e typescript-eslint/typescript-eslint#10940.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  # Actions usadas nos workflows (checkout, setup-node, codeql-action,
  # gitleaks-action...). Manter atualizadas reduz risco de supply chain
  # no próprio CI/CD.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
