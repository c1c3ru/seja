name: CI

on:
  push:
    branches: [dev, homologacao, producao]
  pull_request:
    branches: [dev, homologacao, producao]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Gerar tipos do Next.js (rotas, layouts)
        run: npx next typegen

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: qualidade
    env:
      # Valores de placeholder: o build não acessa o banco, apenas valida env.
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
