name: Gitleaks

on:
  push:
    branches: [dev, homologacao, producao]
  pull_request:
    branches: [dev, homologacao, producao]

permissions:
  contents: read

jobs:
  scan:
    name: Detectar segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gratuito para repositórios de conta individual (não-organização),
      # públicos ou privados — não requer GITLEAKS_LICENSE neste caso.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
