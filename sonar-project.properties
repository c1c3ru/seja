# Configuração do SonarQube Cloud / SonarQube Server para o projeto SEJA.
# sonar.organization e sonar.projectKey devem bater exatamente com os
# valores gerados ao importar o repositório em sonarcloud.io — ver
# .github/SECURITY-SETUP.md, seção 4 ("SonarQube — Continuous Inspection").
sonar.organization=c1c3ru
sonar.projectKey=c1c3ru_seja
sonar.projectName=SEJA

# Código-fonte analisado e raiz dos testes (ver estrutura em README.md).
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Fora do escopo de análise: build, deps, tipos gerados e assets.
sonar.exclusions=**/node_modules/**,**/.next/**,public/**,src/types/database.types.ts,supabase/migrations/**

# Reaproveita o relatório de cobertura do Vitest, se existir
# (ver .github/SECURITY-SETUP.md, seção 3.3). Caminho ausente não é erro.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
